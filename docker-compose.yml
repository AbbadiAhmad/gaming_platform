version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=change-this-in-production-please
      - JWT_EXPIRES_IN=24h
      - DATABASE_PATH=/app/data/gaming_platform.db
    restart: unless-stopped
